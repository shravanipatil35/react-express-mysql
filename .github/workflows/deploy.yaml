name: Production Continuous Deployment

on:
  push:
    branches:
      - master

jobs:
  terraform:
    name: "Provision AWS Infrastructure"
    runs-on: ubuntu-latest
    outputs:
      ec2_ip: ${{ steps.output_ip.outputs.EC2_PUBLIC_IP }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Terraform Engine
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Authenticate AWS Session
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Terraform Init & Apply
        run: |
          cd terraform
          terraform init
          terraform apply -auto-approve

      - name: Capture Instance IP Address
        id: output_ip
        run: |
          cd terraform
          echo "EC2_PUBLIC_IP=$(terraform output -raw ec2_public_ip)" >> $GITHUB_OUTPUT

  build-and-push:
    name: "Build Images & Push to ECR"
    needs: terraform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Authenticate AWS Session
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Backend Image
        run: |
          docker build -t ${{ steps.login-ecr.outputs.registry }}/express-backend:latest ./node-express-server
          docker push ${{ steps.login-ecr.outputs.registry }}/express-backend:latest

      - name: Build and Push Frontend Image
        run: |
          # We explicitly define the build argument and pass it to ensure the react build process bakes it in
          docker build \
            --build-arg REACT_APP_API_URL=http://${{ needs.terraform.outputs.ec2_ip }}:8080/api \
            -t ${{ steps.login-ecr.outputs.registry }}/express-frontend:latest ./react-client
          docker push ${{ steps.login-ecr.outputs.registry }}/express-frontend:latest
  deploy:
    name: "Deploy Containers via Docker Compose"
    needs: [terraform, build-and-push]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Execute Remote Server Setup via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ needs.terraform.outputs.ec2_ip }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Install Docker components if missing
            if ! command -v docker &> /dev/null; then
              sudo apt-get update
              sudo apt-get install -y docker.io docker-compose awscli
              sudo usermod -aG docker ubuntu
            fi

            # Set up a deployment project folder
            mkdir -p app-deployment
            cd app-deployment

            # Create the compose file directly on the machine
            cat << 'EOF' > docker-compose.yml
            ${{ secrets.DOCKER_COMPOSE_CONTENT }}
            EOF

            # Use local AWS CLI to log the EC2 engine directly into ECR
            export AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
            export AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
            
            aws ecr get-login-password --region ap-south-1 | sudo docker login --username AWS --password-stdin 435240837203.dkr.ecr.ap-south-1.amazonaws.com

            # Write out runtime environmental configurations
            echo "AWS_ACCOUNT_ID=435240837203" > .env
            echo "DB_HOST=${{ secrets.DB_HOST }}" >> .env
            echo "DB_USER=${{ secrets.DB_USER }}" >> .env
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
            echo "DB_NAME=${{ secrets.DB_NAME }}" >> .env
            echo "DB_PORT=28114" >> .env
            echo "DB_DIALECT=mysql" >> .env

            # Download fresh prebuilt images and launch
            sudo docker-compose pull
            sudo docker-compose down --remove-orphans
            sudo docker-compose up -d